version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: knowflow_backend
    ports:
      - "8000:8000"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-nex-agi/nex-n2.5-pro:free}
      - CHROMA_PERSIST_DIR=/app/data/vectorstore
      - UPLOAD_DIR=/app/data/uploads
      - SQLITE_DB_PATH=/app/data/knowflow.db
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: knowflow_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
